<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Gestor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--roxo:#4B0082;--roxo2:#7B1FA2;--roxo-light:#EDE7F6;--verde:#2E7D32;--bg:#F4F0FA;--card:#FFFFFF;--border:#E0D7F0;--text:#1A1A2E;--sub:#6B6B8A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);min-height:100vh;}

/* LOGIN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:#fff;border-radius:20px;padding:40px 32px;width:100%;max-width:360px;border:1px solid var(--border);box-shadow:0 8px 32px rgba(75,0,130,0.12);text-align:center;}
.login-logo{font-size:40px;margin-bottom:16px;}
.login-title{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;}
.login-sub{font-size:14px;color:var(--sub);margin-bottom:28px;}
.login-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:13px 16px;font-size:15px;font-family:'DM Sans',sans-serif;color:var(--text);margin-bottom:14px;background:#FAFAFA;}
.login-input:focus{outline:none;border-color:var(--roxo2);}
.login-btn{width:100%;background:var(--roxo);color:#fff;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.login-err{color:#C62828;font-size:13px;margin-top:10px;display:none;}

/* APP */
#app{display:none;}
.topbar{background:var(--roxo);padding:14px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(75,0,130,0.3);}
.topbar-title{color:#fff;font-size:16px;font-weight:600;flex:1;}
.tb-btn{background:rgba(255,255,255,0.15);border:none;color:#fff;border-radius:8px;padding:7px 13px;font-size:12px;font-weight:500;cursor:pointer;}
.nav-tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:90;padding:0 16px;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nt{padding:12px 14px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;flex-shrink:0;font-weight:500;}
.nt.active{color:var(--roxo);border-bottom-color:var(--roxo);font-weight:600;}
.page{padding:16px;max-width:600px;margin:0 auto;}
.tab{display:none;}.tab.active{display:block;}
.card{background:var(--card);border-radius:16px;padding:18px 20px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(75,0,130,0.05);}
.sec{font-size:11px;font-weight:600;color:var(--roxo2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
.mbox{background:#F8F5FF;border-radius:10px;padding:10px 6px;text-align:center;}
.mlabel{font-size:10px;color:var(--sub);margin-bottom:3px;font-weight:500;}
.mval{font-size:19px;font-weight:700;color:var(--text);font-family:'DM Mono',monospace;}
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
.funnel-row{margin-bottom:9px;}
.fhd{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:500;}
.ftrack{background:#F0EBF8;border-radius:6px;height:18px;overflow:hidden;}
.ffill{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;font-size:10px;font-weight:600;color:#fff;min-width:24px;transition:width .6s;}
.divider{border:none;border-top:1px solid #F0EBF8;margin:12px 0;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{background:#F8F5FF;color:var(--sub);font-weight:600;padding:8px 7px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap;}
th.l{text-align:left;}
td{padding:7px;border-bottom:1px solid #F8F5FF;text-align:center;color:var(--text);}
td.l{text-align:left;}
tr:last-child td{border-bottom:none;}
.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500;}
.bg{background:#E8F5E9;color:#2E7D32;}.br{background:#FFEBEE;color:#C62828;}.ba{background:#FFF8E1;color:#F57F17;}
.progress-bar{background:#F0EBF8;border-radius:4px;height:7px;overflow:hidden;margin-top:4px;}
.progress-fill{height:100%;border-radius:4px;transition:width .6s;}
.rec-box{background:#F8F5FF;border-radius:10px;padding:12px 14px;font-size:12px;color:var(--sub);line-height:1.7;margin-bottom:8px;}
.rec-box strong{color:var(--text);font-weight:600;}
.fi{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:'DM Sans',sans-serif;background:#FAFAFA;color:var(--text);margin-bottom:10px;}
select.fi{appearance:none;}
.textarea-fi{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:13px;font-family:'DM Sans',sans-serif;background:#FAFAFA;color:var(--text);resize:vertical;min-height:72px;margin-bottom:10px;}
.btn-main{width:100%;background:var(--roxo);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:2px;}
.btn-sec{background:#F8F5FF;color:var(--roxo);border:1px solid var(--roxo-light);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:500;cursor:pointer;}
.meta-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
.meta-label{font-size:13px;color:var(--sub);flex:1;}
.meta-input{width:100px;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'DM Mono',monospace;background:#FAFAFA;color:var(--text);text-align:center;}
.diag-subtabs{display:flex;gap:6px;padding:14px 0 0;overflow-x:auto;}
.diag-subtabs::-webkit-scrollbar{display:none;}
.dst{padding:7px 14px;font-size:12px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;white-space:nowrap;color:var(--sub);background:#fff;font-weight:500;}
.dst.active{background:var(--roxo);color:#fff;border-color:var(--roxo);}
.dtab{display:none;}.dtab.active{display:block;}
.cor-chip{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;color:#fff;}
.status-pill{display:inline-block;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:500;}
.sp-green{background:#E8F5E9;color:#2E7D32;}.sp-red{background:#FFEBEE;color:#C62828;}.sp-amber{background:#FFF8E1;color:#F57F17;}
.rank-1{background:linear-gradient(90deg,#FFF8E1 0%,#fff 60%);}
.rank-2{background:linear-gradient(90deg,#F5F5F5 0%,#fff 60%);}
.rank-3{background:linear-gradient(90deg,#FBE9E7 0%,#fff 60%);}
.loading{text-align:center;padding:60px 20px;color:var(--sub);}
.cor-list-item{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #F0EBF8;}
.cor-list-item:last-child{border-bottom:none;}
.cor-list-name{font-size:14px;font-weight:500;color:var(--text);}
.cor-list-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-right:10px;}
.btn-del{background:#FFEBEE;color:#C62828;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;}
.btn-del:active{opacity:.8;}
.add-cor-wrap{display:flex;gap:8px;margin-top:12px;}
.add-cor-input{flex:1;border:1.5px solid var(--border);border-radius:10px;padding:11px 14px;font-size:14px;font-family:'DM Sans',sans-serif;background:#FAFAFA;color:var(--text);}
.add-cor-input:focus{outline:none;border-color:var(--roxo2);}
.btn-add{background:var(--roxo);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.chart-wrap{position:relative;width:100%;height:260px;margin-top:8px;}
.equipe-meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
.equipe-meta-box{background:#F8F5FF;border-radius:10px;padding:12px;text-align:center;}
.equipe-meta-label{font-size:11px;color:var(--sub);margin-bottom:4px;}
.equipe-meta-val{font-size:20px;font-weight:700;color:var(--roxo);font-family:'DM Mono',monospace;}
.equipe-prog-wrap{margin-bottom:10px;}
.equipe-prog-label{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:500;}
.equipe-prog-track{background:#F0EBF8;border-radius:6px;height:12px;overflow:hidden;}
.equipe-prog-fill{height:100%;border-radius:6px;transition:width .6s;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--roxo);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--verde);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:500;transition:transform .3s;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">🏠</div>
    <div class="login-title">Painel do Gestor</div>
    <div class="login-sub">Acesso restrito — insira a senha</div>
    <input type="password" class="login-input" id="senha" placeholder="Senha" onkeydown="if(event.key==='Enter')entrar()">
    <button class="login-btn" onclick="entrar()">Entrar</button>
    <div class="login-err" id="login-err">Senha incorreta.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <span class="topbar-title">📊 Dashboard — Gestor</span>
    <button class="tb-btn" onclick="sair()">Sair</button>
  </div>
  <div class="nav-tabs">
    <div class="nt active" onclick="tab('funil',this)">Funil</div>
    <div class="nt" onclick="tab('ranking',this)">Ranking</div>
    <div class="nt" onclick="tab('presenca',this)">Presença</div>
    <div class="nt" onclick="tab('metas',this)">Metas</div>
    <div class="nt" onclick="tab('um-a-um',this)">1x1</div>
    <div class="nt" onclick="tab('meta-equipe',this)">🎯 Meta Equipe</div>
    <div class="nt" onclick="tab('graficos',this)">📈 Gráficos</div>
    <div class="nt" onclick="tab('diagnostico',this)">Diagnóstico</div>
    <div class="nt" onclick="tab('config',this)">⚙️ Config</div>
  </div>
  <div class="page">
    <div id="tab-funil" class="tab active"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
    <div id="tab-ranking" class="tab"></div>
    <div id="tab-presenca" class="tab"></div>
    <div id="tab-metas" class="tab"></div>
    <div id="tab-um-a-um" class="tab"></div>
    <div id="tab-meta-equipe" class="tab"></div>
    <div id="tab-graficos" class="tab"></div>
    <div id="tab-diagnostico" class="tab"></div>
    <div id="tab-config" class="tab"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, setDoc, doc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAtnfPDfgmaeLsHpwHu0JBZNsbh3bU-KhI",
  authDomain: "corretores-49f70.firebaseapp.com",
  projectId: "corretores-49f70",
  storageBucket: "corretores-49f70.firebasestorage.app",
  messagingSenderId: "578258292861",
  appId: "1:578258292861:web:c53e2c640a6bea01546114"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const SENHA = "gestor2026";
let CORRETORES = ["Fabio Thomaz","Bruna Sagati","Yuri Volcov","Fernanda Batalhone","Diego Gaspar","Vilma Colaço","Sergio Junior","Lucas Afonso","Sibele Gois"];
const CAMPOS = [{n:"Ligações",i:"📞"},{n:"Leads",i:"🎯"},{n:"Conversas",i:"💬"},{n:"Agendamentos",i:"📅"},{n:"Visitas",i:"🏠"},{n:"Propostas",i:"📄"},{n:"Vendas",i:"🏆"}];
const AVATAR_CORES = ["#7B1FA2","#0277BD","#2E7D32","#C62828","#E65100","#00838F","#558B2F","#6A1B9A","#283593"];
const AVATARES = {"Fabio Thomaz":"FT","Bruna Sagati":"BS","Yuri Volcov":"YV","Fernanda Batalhone":"FB","Diego Gaspar":"DG","Vilma Colaço":"VC","Sergio Junior":"SJ","Lucas Afonso":"LA","Sibele Gois":"SG"};

let DADOS = [], METAS = {}, REUNIOES = [], VGV_REAL = {};

// LOGIN
window.entrar = () => {
  if(document.getElementById("senha").value === SENHA){
    document.getElementById("login-screen").style.display="none";
    document.getElementById("app").style.display="block";
    carregarTudo();
  } else {
    document.getElementById("login-err").style.display="block";
  }
};
window.sair = () => { location.reload(); };

async function carregarTudo(){
  try {
    const corSnap = await getDocs(collection(db,"config"));
    corSnap.forEach(d => {
      if(d.id === "corretores" && d.data().lista && d.data().lista.length > 0){
        CORRETORES = d.data().lista;
      }
    });
  } catch(e){}
  const [lancSnap, metaSnap, reunSnap] = await Promise.all([
    getDocs(collection(db,"lancamentos")),
    getDocs(collection(db,"metas")),
    getDocs(collection(db,"reunioes"))
  ]);
  DADOS = lancSnap.docs.map(d=>({id:d.id,...d.data()}));
  // Pre-calc VGV real per corretor
  VGV_REAL = {};
  CORRETORES.forEach(c=>VGV_REAL[c]=0);
  DADOS.forEach(r=>{
    if(VGV_REAL[r.corretor]!==undefined && r.valores_venda)
      r.valores_venda.forEach(v=>VGV_REAL[r.corretor]+=v);
  });
  metaSnap.docs.forEach(d=>{ METAS[d.data().corretor]=d.data(); });
  REUNIOES = reunSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);
  await loadMetaEquipe();
  renderFunil();
}

function getAcum(){
  const tot={};
  CORRETORES.forEach(c=>tot[c]=new Array(7).fill(0));
  DADOS.forEach(r=>{ if(tot[r.corretor]) r.valores.forEach((v,i)=>tot[r.corretor][i]+=v); });
  return tot;
}
function pct(a,b){return b>0?Math.round(a/b*100):0;}
function cc(pp){return pp>=80?"#2E7D32":pp>=50?"#F57F17":"#C62828";}

window.tab = (name, el) => {
  document.querySelectorAll(".nt").forEach(t=>t.classList.remove("active"));
  el.classList.add("active");
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab-"+name).classList.add("active");
  if(name==="funil") renderFunil();
  else if(name==="ranking") renderRanking();
  else if(name==="presenca") renderPresenca();
  else if(name==="metas") renderMetas();
  else if(name==="um-a-um") render1x1();
  else if(name==="diagnostico") renderDiag();
  else if(name==="config") renderConfig();
  else if(name==="meta-equipe") renderMetaEquipe();
  else if(name==="graficos") renderGraficos();
};

// FUNIL
function renderFunil(){
  const ac=getAcum(), T=new Array(7).fill(0);
  CORRETORES.forEach(c=>ac[c].forEach((v,i)=>T[i]+=v));
  const etapas=[["Ligações → Leads",T[0],T[1],"#7B1FA2"],["Leads → Conversas",T[1],T[2],"#AB47BC"],["Conversas → Agend.",T[2],T[3],"#F57C00"],["Agend. → Visitas",T[3],T[4],"#388E3C"],["Visitas → Propostas",T[4],T[5],"#E65100"],["Propostas → Vendas",T[5],T[6],"#2E7D32"]];
  let h=`<div class="card" style="margin-top:14px"><div class="metric-grid">${CAMPOS.map((f,i)=>`<div class="mbox"><div class="mlabel">${f.n}</div><div class="mval">${T[i]}</div></div>`).join("")}</div><div class="divider"></div><div class="sec">Taxas de conversão</div>`;
  etapas.forEach(([l,de,para,cor])=>{const p=pct(para,de),w=Math.max(p,2);h+=`<div class="funnel-row"><div class="fhd"><span>${l}${p<20&&de>0?' ⚠️':''}</span><span>${de}→${para} <b>${p}%</b></span></div><div class="ftrack"><div class="ffill" style="width:${w}%;background:${cor}">${p}%</div></div></div>`;});
  document.getElementById("tab-funil").innerHTML=h+"</div>";
}

// RANKING
function rankScore(v){return v[6]*1e12+v[5]*1e10+v[4]*1e8+v[3]*1e6+v[2]*1e4+v[1]*1e2+v[0];}
function rankCrit(v){if(v[6]>0)return`${v[6]} venda${v[6]>1?'s':''}`;if(v[5]>0)return`${v[5]} prop.`;if(v[4]>0)return`${v[4]} visita${v[4]>1?'s':''}`;if(v[3]>0)return`${v[3]} agend.`;if(v[2]>0)return`${v[2]} conv.`;if(v[1]>0)return`${v[1]} leads`;return`${v[0]} lig.`;}

function renderRanking(){
  const ac=getAcum(), T=new Array(7).fill(0);
  CORRETORES.forEach(c=>ac[c].forEach((v,i)=>T[i]+=v));
  const sorted=[...CORRETORES].sort((a,b)=>rankScore(ac[b])-rankScore(ac[a]));
  const medals=["🥇","🥈","🥉"];
  let rows=sorted.map((c,i)=>{const v=ac[c];const rc=i<3?`class="rank-${i+1}"`:'';return`<tr ${rc}><td class="l">${medals[i]||i+1} ${c.split(" ")[0]}</td><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td><td>${v[4]}</td><td>${v[5]}</td><td><b>${v[6]}</b></td><td><span class="badge ${i===0?'bg':i<3?'ba':'br'}">${rankCrit(v)}</span></td></tr>`;}).join("");
  document.getElementById("tab-ranking").innerHTML=`<div class="card" style="margin-top:14px"><div class="sec">Critério: Vendas → Propostas → Visitas → Agend. → Conv. → Leads → Lig.</div><div style="overflow-x:auto"><table><thead><tr><th class="l">Corretor</th><th>Lig</th><th>Lead</th><th>Conv</th><th>Ag</th><th>Vis</th><th>Prop</th><th>Vend</th><th>Critério</th></tr></thead><tbody>${rows}<tr style="font-weight:700;background:#F8F5FF"><td class="l">Total</td><td>${T[0]}</td><td>${T[1]}</td><td>${T[2]}</td><td>${T[3]}</td><td>${T[4]}</td><td>${T[5]}</td><td>${T[6]}</td><td></td></tr></tbody></table></div></div>`;
}

// PRESENÇA
function renderPresenca(){
  const datas=[...new Set(DADOS.map(r=>r.data))].sort().slice(-6);
  if(!datas.length){document.getElementById("tab-presenca").innerHTML='<div class="card" style="margin-top:14px;color:var(--sub);font-size:13px;text-align:center;padding:30px">Nenhum lançamento ainda.</div>';return;}
  let rows=CORRETORES.map(c=>{const cells=datas.map(dt=>{const ok=DADOS.some(r=>r.corretor===c&&r.data===dt);return`<td>${ok?'✅':'❌'}</td>`;}).join("");const tot=datas.filter(dt=>DADOS.some(r=>r.corretor===c&&r.data===dt)).length;const cls=tot===datas.length?"bg":tot===0?"br":"ba";return`<tr><td class="l">${c.split(" ")[0]}</td>${cells}<td><span class="badge ${cls}">${tot}/${datas.length}</span></td></tr>`;}).join("");
  const hds=datas.map(dt=>`<th>${dt.slice(5).replace("-","/")}</th>`).join("");
  document.getElementById("tab-presenca").innerHTML=`<div class="card" style="margin-top:14px"><div style="overflow-x:auto"><table><thead><tr><th class="l">Corretor</th>${hds}<th>Total</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

// METAS
function renderMetas(){
  const ac=getAcum();
  let html=`<div class="card" style="margin-top:14px"><div class="sec">Metas mensais por corretor</div>`;
  CORRETORES.forEach(c=>{
    const m=METAS[c]||null, v=ac[c];
    html+=`<div style="padding:12px 0;border-bottom:1px solid #F0EBF8"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:13px;font-weight:600;color:var(--text)">${c.split(" ")[0]}</span><button class="btn-sec" onclick="editarMeta('${c}')">✏️ Editar</button></div>`;
    if(m&&m.vendas_mes){
      const vgv_real = VGV_REAL[c]||0;
      const vgv_meta = m.comissao/(m.perc_com/100);
      const pVgv = pct(vgv_real,vgv_meta);

    } else html+=`<span style="font-size:12px;color:#BBA;">Meta não configurada</span>`;
    html+=`</div>`;
  });
  document.getElementById("tab-metas").innerHTML=html+"</div>";
}

window.salvarMeta = async (cor) => {

function buildGeral(T,ac){
  const p34=pct(T[3],T[2]),p45=pct(T[4],T[3]),p56=pct(T[5],T[4]);
  const ausentes=CORRETORES.filter(c=>ac[c][0]===0);
  let gargalos="";
  if(p34<30&&T[2]>0) gargalos+=`<div class="rec-box"><strong>🔴 Conversas → Agendamentos (${p34}%)</strong><br>De ${T[2]} conversas, apenas ${T[3]} viraram agendamento. Script: "Você tem disponibilidade quarta ou quinta?"</div>`;
  if(p45<60&&T[3]>0) gargalos+=`<div class="rec-box"><strong>🔴 Agendamentos → Visitas (${p45}%)</strong><br>${T[3]-T[4]} agendamentos caíram. Protocolo: ligar 24h antes + mensagem na manhã.</div>`;
  if(p56<50&&T[4]>0) gargalos+=`<div class="rec-box"><strong>🟡 Visitas → Propostas (${p56}%)</strong><br>Regra: sair com proposta, nova data ou motivo do não.</div>`;
  if(!gargalos) gargalos=`<div class="rec-box" style="color:var(--verde)">✅ Nenhum gargalo crítico.</div>`;
  let metaStatus="";
  CORRETORES.forEach(c=>{const m=METAS[c];if(!m||!m.vendas_mes)return;const vv=ac[c][6];const pp=pct(vv,m.vendas_mes);const cls=pp>=80?"sp-green":pp>=50?"sp-amber":"sp-red";metaStatus+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #F0EBF8"><span style="font-size:13px;font-weight:500">${c.split(" ")[0]}</span><div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:var(--sub)">${vv}/${m.vendas_mes} vendas</span><span class="status-pill ${cls}">${pp}%</span></div></div>`;});
  return `<div class="card"><div class="sec">Funil geral</div>${[["Lig→Lead",T[0],T[1],"#7B1FA2"],["Lead→Conv",T[1],T[2],"#AB47BC"],["Conv→Agend",T[2],T[3],"#F57C00"],["Agend→Vis",T[3],T[4],"#388E3C"],["Vis→Prop",T[4],T[5],"#E65100"],["Prop→Vend",T[5],T[6],"#2E7D32"]].map(([l,de,para,cor])=>{const p=pct(para,de),w=Math.max(p,2);return`<div class="funnel-row"><div class="fhd"><span>${l}</span><span>${de}→${para} <b>${p}%</b></span></div><div class="ftrack"><div class="ffill" style="width:${w}%;background:${cor}">${p}%</div></div></div>`;}).join("")}</div>
  <div class="card"><div class="sec">Gargalos</div>${gargalos}</div>
  ${metaStatus?`<div class="card"><div class="sec">Atingimento — Vendas</div>${metaStatus}</div>`:''}
  <div class="card"><div class="sec">Ações prioritárias</div>
    <div class="rec-box"><strong>1.</strong> Fechar data dentro da conversa qualificada</div>
    <div class="rec-box"><strong>2.</strong> Confirmar visita 24h antes + manhã do dia</div>
    <div class="rec-box"><strong>3.</strong> Sair de toda visita com proposta ou compromisso</div>
    ${ausentes.length?`<div class="rec-box"><strong>⚠️ Sem registro:</strong> ${ausentes.join(", ")}</div>`:''}
  </div>`;
}

function buildIndividual(nome,v,meta){
  const idx=CORRETORES.indexOf(nome), avatarCor=AVATAR_CORES[idx%AVATAR_CORES.length];
  const etapas=[["Lig→Leads",v[0],v[1],"#7B1FA2"],["Leads→Conv",v[1],v[2],"#AB47BC"],["Conv→Agend",v[2],v[3],"#F57C00"],["Agend→Vis",v[3],v[4],"#388E3C"],["Vis→Prop",v[4],v[5],"#E65100"],["Prop→Vend",v[5],v[6],"#2E7D32"]];
  const funil=etapas.map(([l,de,para,cor])=>{const p=pct(para,de),w=Math.max(p,2);return`<div class="funnel-row"><div class="fhd"><span>${l}</span><span>${de}→${para} <b>${p}%</b></span></div><div class="ftrack"><div class="ffill" style="width:${w}%;background:${cor}">${p}%</div></div></div>`;}).join("");
  const nums=CAMPOS.map((f,i)=>`<div class="mbox"><div class="mlabel">${f.n}</div><div class="mval" style="font-size:15px">${v[i]}</div></div>`).join("");
  const p12=pct(v[1],v[0]),p23=pct(v[2],v[1]),p34=pct(v[3],v[2]),p45=pct(v[4],v[3]),p56=pct(v[5],v[4]);
  let gargalos="",treino="";
  if(v[0]===0){gargalos=`<div class="rec-box">⚠️ Nenhum dado lançado ainda.</div>`;}
  else{
    if(p12<15) gargalos+=`<div class="rec-box"><strong>🔴 Lig→Leads (${p12}%)</strong><br>Revisar script de abordagem — primeiros 30 segundos.</div>`;
    if(p23<15) gargalos+=`<div class="rec-box"><strong>🔴 Leads→Conversas (${p23}%)</strong><br>Treinamento: perguntas de sondagem para qualificação.</div>`;
    if(p34<25) gargalos+=`<div class="rec-box"><strong>🔴 Conversas→Agend (${p34}%)</strong><br>Script: "Você tem disponibilidade quarta ou quinta?"</div>`;
    if(p45<60&&v[3]>0) gargalos+=`<div class="rec-box"><strong>🟡 Agend→Visitas (${p45}%)</strong><br>Protocolo de confirmação 24h antes + manhã do dia.</div>`;
    if(p56<50&&v[4]>0) gargalos+=`<div class="rec-box"><strong>🟡 Vis→Propostas (${p56}%)</strong><br>Técnica de fechamento durante a visita.</div>`;
    if(!gargalos) gargalos=`<div class="rec-box" style="color:var(--verde)">✅ Funil equilibrado. Manter consistência.</div>`;
    if(p34<25) treino=`<div class="rec-box"><strong>🎯 Prioridade:</strong> Script de comprometimento de data dentro da conversa.</div>`;
    else if(p45<60&&v[3]>0) treino=`<div class="rec-box"><strong>🎯 Prioridade:</strong> Protocolo de confirmação de visita.</div>`;
    else if(p56<50&&v[4]>0) treino=`<div class="rec-box"><strong>🎯 Prioridade:</strong> Fechamento na visita — proposta, segunda data ou motivo do não.</div>`;
    else if(p12<15) treino=`<div class="rec-box"><strong>🎯 Prioridade:</strong> Script de abordagem — qualificar nos primeiros 30 segundos.</div>`;
  }
  let metaHtml="";
  if(meta&&meta.vendas_mes){
    const items=[["Leads",v[1],meta.leads_mes],["Visitas",v[4],meta.visitas_mes],["Vendas",v[6],meta.vendas_mes]];
    metaHtml=`<div class="card"><div class="sec">Atingimento de meta</div>${items.map(([n,r,m])=>{const pp=pct(r,m);return`<div style="margin-bottom:7px"><div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:3px"><span>${n}</span><span style="color:${cc(pp)};font-weight:600">${r}/${m} · ${pp}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pp}%;background:${cc(pp)}"></div></div></div>`;}).join("")}</div>`;
  }
  return `<div class="card"><div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><div class="cor-chip" style="background:${avatarCor}">${AVATARES[nome]}</div><div><div style="font-size:15px;font-weight:600;color:var(--text)">${nome}</div><div style="font-size:12px;color:var(--sub)">Diagnóstico individual</div></div></div><div class="metric-grid">${nums}</div><div class="divider"></div><div class="sec">Funil</div>${funil}</div><div class="card"><div class="sec">Gargalos</div>${gargalos}</div>${treino?`<div class="card"><div class="sec">Treinamento recomendado</div>${treino}</div>`:''}${metaHtml}`;
}

function renderMetaEquipe(){

  const T=new Array(7).fill(0);
  CORRETORES.forEach(c=>ac[c].forEach((v,i)=>T[i]+=v));

  const m=META_EQUIPE;
  const hasM = m && m.vendas_mes;
  const p=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
  const cc=(pp)=>pp>=80?"#2E7D32":pp>=50?"#F57F17":"#C62828";

  const vgv_meta = hasM ? m.comissao/(m.perc_com/100) : 0;
  const pVgv = p(vgv_real_total, vgv_meta);
  const com_real = vgv_real_total*(hasM?m.perc_com/100:0);

  let progressHtml = "";
  if(hasM){
    const itens=[
      ["🎯 Leads", T[1], m.leads_mes, "#7B1FA2"],

      ["🏆 Vendas", T[6], m.vendas_mes, "#2E7D32"],

      ["💰 Comissão", com_real, m.comissao, "#C62828"],

    itens.forEach(([n,real,meta,cor])=>{
      const pp=p(real,meta);
      const fmt=(v,isMoney)=>isMoney?(v>=1000000?"R$ "+(v/1000000).toFixed(2).replace('.',',')+"M":v>=1000?"R$ "+(v/1000).toFixed(0)+"k":"R$ "+Math.round(v)):v;
      const isMoney=n.includes("VGV")||n.includes("Comissão");
      progressHtml+=`<div class="equipe-prog-wrap">
        <div class="equipe-prog-label"><span>${n}</span><span style="color:${cc(pp)}">${fmt(real,isMoney)} / ${fmt(meta,isMoney)} · ${pp}%</span></div>
        <div class="equipe-prog-track"><div class="equipe-prog-fill" style="width:${pp}%;background:${cor}"></div></div>
      </div>`;
    });
  }

  document.getElementById("tab-meta-equipe").innerHTML=`
    <div class="card" style="margin-top:14px">
      <div class="sec">Meta geral da equipe</div>
      ${!hasM?'<div class="rec-box">Meta da equipe não configurada. Clique em Editar abaixo.</div>':''}

      <button class="btn-sec" style="width:100%;margin-top:12px" onclick="editarMetaEquipe()">✏️ Editar meta da equipe</button>

      <div class="sec">Resumo do time</div>
      <div class="equipe-meta-grid">
        <div class="equipe-meta-box"><div class="equipe-meta-label">Ligações</div><div class="equipe-meta-val">${T[0]}</div></div>
        <div class="equipe-meta-box"><div class="equipe-meta-label">Leads</div><div class="equipe-meta-val">${T[1]}</div></div>
        <div class="equipe-meta-box"><div class="equipe-meta-label">Conversas</div><div class="equipe-meta-val">${T[2]}</div></div>
        <div class="equipe-meta-box"><div class="equipe-meta-label">Agendamentos</div><div class="equipe-meta-val">${T[3]}</div></div>
        <div class="equipe-meta-box"><div class="equipe-meta-label">Visitas</div><div class="equipe-meta-val">${T[4]}</div></div>
        <div class="equipe-meta-box"><div class="equipe-meta-label">Vendas</div><div class="equipe-meta-val">${T[6]}</div></div>
      </div>
    </div>`;
}

window.editarMetaEquipe = () => {
  const m=META_EQUIPE||{comissao:100000,perc_com:1.4,ticket:600000,visitas_venda:8,atend_visita:5,leads_atend:3};
  document.getElementById("tab-meta-equipe").innerHTML=`<div class="card" style="margin-top:14px">
    <div class="sec">Meta geral da equipe</div>
    <div style="background:#FFFDE7;border-radius:10px;padding:14px;margin-bottom:14px">
      <div class="meta-row"><span class="meta-label">🎯 Objetivo comissão equipe (R$)</span><input class="meta-input" type="number" id="me-com" value="${m.comissao}" oninput="calcMetaEquipe()"></div>
      <div class="meta-row"><span class="meta-label">% Comissão efetiva</span><input class="meta-input" type="number" id="me-pcom" value="${m.perc_com}" step="0.1" oninput="calcMetaEquipe()"></div>
      <div class="meta-row"><span class="meta-label">🏷️ Ticket médio (R$)</span><input class="meta-input" type="number" id="me-tick" value="${m.ticket}" oninput="calcMetaEquipe()"></div>
      <div class="meta-row"><span class="meta-label">🏠 Visitas por venda</span><input class="meta-input" type="number" id="me-vpv" value="${m.visitas_venda}" oninput="calcMetaEquipe()"></div>
      <div class="meta-row"><span class="meta-label">💬 Atend. por visita</span><input class="meta-input" type="number" id="me-apv" value="${m.atend_visita}" oninput="calcMetaEquipe()"></div>
      <div class="meta-row"><span class="meta-label">🎯 Leads por atend.</span><input class="meta-input" type="number" id="me-lpa" value="${m.leads_atend}" oninput="calcMetaEquipe()"></div>
    </div>
    <div style="background:#E8F5E9;border-radius:10px;padding:14px;margin-bottom:14px" id="me-calc"></div>
    <button class="btn-main" onclick="salvarMetaEquipe()">Salvar meta da equipe</button>
    <button class="btn-sec" style="width:100%;margin-top:8px" onclick="renderMetaEquipe()">Cancelar</button>
  </div>`;
  calcMetaEquipe();
};

window.calcMetaEquipe = () => {
  const com=+document.getElementById("me-com").value||0;
  const pcom=+document.getElementById("me-pcom").value||1.4;
  const tick=+document.getElementById("me-tick").value||1;
  const vpv=+document.getElementById("me-vpv").value||1;
  const apv=+document.getElementById("me-apv").value||1;
  const lpa=+document.getElementById("me-lpa").value||1;
  const vgv=com/(pcom/100);
  const vendas=vgv/tick;
  const visitas=vendas*vpv;
  const atend=visitas*apv;
  const leads=atend*lpa;
  const fmtV=(n)=>n>=1000000?"R$ "+(n/1000000).toFixed(2).replace('.',',')+"M":n>=1000?"R$ "+(n/1000).toFixed(0)+"k":"R$ "+Math.round(n);
  document.getElementById("me-calc").innerHTML=`
    <div class="sec" style="margin-bottom:10px">Metas desdobradas da equipe</div>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">
      ${[["VGV",fmtV(vgv)],["Vendas",vendas.toFixed(1)],["Visitas",Math.ceil(visitas)],["Atendimentos",Math.ceil(atend)],["Leads",Math.ceil(leads)]].map(([n,v])=>`
        <div style="background:#fff;border-radius:8px;padding:10px;text-align:center">
          <div style="font-size:10px;color:var(--sub);margin-bottom:3px">${n}</div>
          <div style="font-size:16px;font-weight:700;color:var(--roxo)">${v}</div>
          <div style="font-size:10px;color:var(--sub)">mês</div>
        </div>`).join("")}
    </div>`;
};

window.salvarMetaEquipe = async () => {
  const m={
    comissao:+document.getElementById("me-com").value,
    perc_com:+document.getElementById("me-pcom").value,
    ticket:+document.getElementById("me-tick").value,
    visitas_venda:+document.getElementById("me-vpv").value,
    atend_visita:+document.getElementById("me-apv").value,
    leads_atend:+document.getElementById("me-lpa").value
  };
  m.vendas_mes=Math.ceil((m.comissao/(m.perc_com/100))/m.ticket);
  m.visitas_mes=Math.ceil(m.vendas_mes*m.visitas_venda);
  m.leads_mes=Math.ceil(m.visitas_mes*m.atend_visita*m.leads_atend);
  await setDoc(doc(db,"config","meta_equipe"),m);
  META_EQUIPE=m;
  showToast("✅ Meta da equipe salva!");
  renderMetaEquipe();
};

// ── GRÁFICOS SEMANAIS ─────────────────────────────────────────
function getSemanasLeadsVisitas(){
  // Agrupa dados por semana ISO
  const semanas={};
  DADOS.forEach(r=>{
    const d=new Date(r.data+"T00:00:00");
    const jan1=new Date(d.getFullYear(),0,1);
    const week=Math.ceil(((d-jan1)/86400000+jan1.getDay()+1)/7);
    const key=d.getFullYear()+"-S"+String(week).padStart(2,"0");
    if(!semanas[key]) semanas[key]={label:key,leads:0,visitas:0};
    semanas[key].leads += r.valores[1]||0;
    semanas[key].visitas += r.valores[4]||0;
  });
  return Object.values(semanas).sort((a,b)=>a.label.localeCompare(b.label)).slice(-8);
}

function renderGraficos(){
  document.getElementById("tab-graficos").innerHTML=`
    <div class="card" style="margin-top:14px">
      <div class="sec">Novos leads por semana</div>
      <div class="chart-wrap"><canvas id="chart-leads" role="img" aria-label="Gráfico de leads por semana"></canvas></div>
    </div>
    <div class="card">
      <div class="sec">Visitas realizadas por semana</div>
      <div class="chart-wrap"><canvas id="chart-visitas" role="img" aria-label="Gráfico de visitas por semana"></canvas></div>
    </div>`;

  const semanas=getSemanasLeadsVisitas();
  const labels=semanas.map(s=>s.label.replace(/\d+-/,""));

  if(chartLeads) chartLeads.destroy();
  if(chartVisitas) chartVisitas.destroy();

  chartLeads = new Chart(document.getElementById("chart-leads"),{
    type:"bar",
    data:{
      labels,
      datasets:[{
        label:"Novos Leads",
        data:semanas.map(s=>s.leads),
        backgroundColor:"#AB47BC99",
        borderColor:"#7B1FA2",
        borderWidth:2,
        borderRadius:6
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{size:11}}},x:{ticks:{font:{size:11}}}}}
  });

  chartVisitas = new Chart(document.getElementById("chart-visitas"),{
    type:"bar",
    data:{
      labels,
      datasets:[{
        label:"Visitas Realizadas",
        data:semanas.map(s=>s.visitas),
        backgroundColor:"#66BB6A99",
        borderColor:"#2E7D32",
        borderWidth:2,
        borderRadius:6
      }]
    },
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{font:{size:11}}},x:{ticks:{font:{size:11}}}}}
  });
}

window.showToast = (msg) => { const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2800); };

const AVATAR_CORES_LIST = ["#7B1FA2","#0277BD","#2E7D32","#C62828","#E65100","#00838F","#558B2F","#6A1B9A","#283593"];
function getInitials(nome){ const p=nome.trim().split(" "); return p.length>=2?p[0][0]+p[p.length-1][0]:nome.slice(0,2).toUpperCase(); }

function renderConfig(){
  const listHtml = CORRETORES.map((c,i) => {
    const bg = AVATAR_CORES_LIST[i % AVATAR_CORES_LIST.length];
    return `<div class="cor-list-item">
      <div style="display:flex;align-items:center">
        <div class="cor-list-avatar" style="background:${bg}">${getInitials(c)}</div>
        <span class="cor-list-name">${c}</span>
      </div>
      <button class="btn-del" onclick="removerCorretor('${c}')">✕ Remover</button>
    </div>`;
  }).join("");

  document.getElementById("tab-config").innerHTML = `
    <div class="card" style="margin-top:14px">
      <div class="sec">Corretores cadastrados (${CORRETORES.length})</div>
      <div id="cor-list">${listHtml}</div>
      <div class="add-cor-wrap">
        <input class="add-cor-input" type="text" id="novo-cor" placeholder="Nome completo do corretor...">
        <button class="btn-add" onclick="adicionarCorretor()">+ Adicionar</button>
      </div>
    </div>
    <div class="card">
      <div class="sec">Informações</div>
      <div class="rec-box">Os corretores cadastrados aqui aparecem automaticamente no formulário de lançamento. Ao remover um corretor, o histórico de dados dele é mantido.</div>
    </div>`;
}

window.adicionarCorretor = async () => {
  const inp = document.getElementById("novo-cor");
  const nome = inp.value.trim();
  if(!nome){ showToast("⚠️ Digite o nome do corretor"); return; }
  if(CORRETORES.includes(nome)){ showToast("⚠️ Corretor já cadastrado"); return; }
  CORRETORES.push(nome);
  await setDoc(doc(db,"config","corretores"), { lista: CORRETORES });
  inp.value = "";
  showToast("✅ " + nome + " adicionado!");
  renderConfig();
};

window.removerCorretor = async (nome) => {
  if(!confirm("Remover " + nome + " da lista?")) return;
  CORRETORES = CORRETORES.filter(c => c !== nome);
  await setDoc(doc(db,"config","corretores"), { lista: CORRETORES });
  showToast("✅ " + nome + " removido!");
  renderConfig();
};
</script>
